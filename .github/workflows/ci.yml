name: CI

# Deliberately not on pushes to main. The release workflow runs there, and its
# Verify step is a superset of everything here — running both duplicated the
# work and, with only two macOS slots on the node, made each push queue behind
# itself for the better part of ten minutes.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Sapling builds itself, on the node Sapling provisioned.
    runs-on: [self-hosted, macos, arm64]
    # A self-hosted job queues indefinitely when no runner matches, so cap it
    # rather than letting a run hang until someone notices.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Workflows
        run: ./scripts/check-workflows.sh

      - name: Lint
        run: ./scripts/lint.sh

      - name: File sizes
        run: ./scripts/check-file-sizes.sh

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

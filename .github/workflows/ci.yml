name: CI

# Main and pull requests, and nothing else.
#
# The release workflow no longer runs on push, so this is the only thing
# checking main — and the two never run together, which is what made every
# push queue behind itself.
#
# Other branches are deliberately not covered: each run boots a macOS VM for
# minutes and occupies half the node. A branch gets checked when it becomes a
# pull request, or on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Sapling builds itself, on the node Sapling provisioned.
    runs-on: [self-hosted, macos, arm64]
    # A self-hosted job queues indefinitely when no runner matches, so cap it
    # rather than letting a run hang until someone notices.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Workflows
        run: ./scripts/check-workflows.sh

      - name: Lint
        run: ./scripts/lint.sh

      - name: File sizes
        run: ./scripts/check-file-sizes.sh

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

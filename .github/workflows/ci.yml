name: CI

# Main and pull requests, and nothing else.
#
# The release workflow no longer runs on push, so this is the only thing
# checking main — and the two never run together, which is what made every
# push queue behind itself.
#
# Other branches are deliberately not covered: each run boots a macOS VM for
# minutes and occupies half the node. A branch gets checked when it becomes a
# pull request, or on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Sapling builds itself, on the node Sapling provisioned.
    runs-on: [self-hosted, macos, arm64]
    # A self-hosted job queues indefinitely when no runner matches, so cap it
    # rather than letting a run hang until someone notices.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Swift version
        run: swift --version

      - name: Workflows
        run: ./scripts/check-workflows.sh

      - name: Lint
        run: ./scripts/lint.sh

      - name: File sizes
        run: ./scripts/check-file-sizes.sh

      # Cheap (about a second) and it closes the last gap between these checks
      # and the release pipeline's, which is what lets a release triggered by
      # this run skip re-verifying anything.
      - name: Version derivation
        run: ./scripts/test-next-version.sh

      # The node's build cache, when it has one turned on (see
      # docs/CONFIGURATION.md#build-cache). Skipped everywhere else, and only a
      # green run on main is kept for the next one.
      - name: Restore build cache
        if: env.SAPLING_BUILD_CACHE != ''
        run: |
          if [ -d "$SAPLING_BUILD_CACHE/.build" ]; then
            time cp -R "$SAPLING_BUILD_CACHE/.build" .
          else
            echo "build cache is empty; this build is cold"
          fi

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Save build cache
        if: success() && env.SAPLING_BUILD_CACHE != ''
        run: time rsync -a --delete .build/ "$SAPLING_BUILD_CACHE/.build/"

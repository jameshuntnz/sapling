name: Release

# Every push to main publishes a dev build. Promotion to rc and stable is
# deliberate — run this workflow by hand and choose the channel.
#
# Hotfixes are cut from a release branch (release/X.Y.x) so a fix can ship
# without dragging in whatever has since landed on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to publish"
        required: true
        default: rc
        type: choice
        options: [rc, stable, hotfix]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Sapling releases itself, on the node Sapling provisioned.
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # version derivation needs full history and tags

      # Worth it by a distance: an uncached release spends ~460s compiling,
      # a cached one ~30s. The restore itself costs ~130s, which is the price
      # of every job running in a fresh VM with an empty .build.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
            spm-release-${{ runner.os }}-

      - name: Work out the version
        id: version
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'dev' }}"
          VERSION="$(./scripts/next-version.sh "$CHANNEL" || true)"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ]; then
            echo "Nothing to release on $CHANNEL: no feat/fix/perf commits since the last release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # Build metadata stays in the version the binary reports, but is
            # stripped from the tag: "+" is literal in a URL path and a space
            # in a query string, which is a good way to lose a release. Semver
            # ignores it for precedence, so the tag loses nothing that matters.
            TAG="v${VERSION%%+*}"
            echo "Releasing $VERSION on $CHANNEL as $TAG"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      # Never publish something that does not pass its own checks.
      - name: Verify
        if: steps.version.outputs.release == 'true'
        run: |
          ./scripts/check-workflows.sh
          ./scripts/lint.sh
          ./scripts/check-file-sizes.sh
          ./scripts/test-next-version.sh
          # Debug, deliberately. Testing in release configuration looks like
          # it would let the packaging step below reuse the artifacts, but
          # `swift test` builds with testability enabled and the product build
          # cannot reuse those either way: measured at 196s against 192s for
          # debug, so it buys nothing and compiles slower.
          swift test

      - name: Stamp the version
        if: steps.version.outputs.release == 'true'
        run: |
          sed -i '' "s/current = \"[^\"]*\"/current = \"${{ steps.version.outputs.version }}\"/" \
            Sources/SaplingCore/Models/DTOs.swift
          grep -n 'current = ' Sources/SaplingCore/Models/DTOs.swift

      - name: Build and package
        if: steps.version.outputs.release == 'true'
        run: |
          # Named from the tag rather than the version: an asset name carrying
          # "+" risks being mangled in transit, and the daemon matches the
          # downloaded file's name against SHA256SUMS when verifying it.
          NAME="${{ steps.version.outputs.tag }}"
          NAME="sapling-${NAME#v}-macos-arm64.tar.gz"
          swift build -c release --product sapling
          mkdir -p dist && cp .build/release/sapling dist/
          tar -czf "dist/$NAME" -C dist sapling
          rm dist/sapling
          cd dist
          # The daemon verifies this before installing anything it downloads.
          shasum -a 256 *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Only a finished release moves the version recorded in the source. A dev
      # build's version is derived, and committing one per push would both spam
      # main and re-trigger this workflow. Done before tagging so a stable tag
      # points at the commit recording that version, not the one before it.
      - name: Tag and record
        if: steps.version.outputs.release == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.version.outputs.channel }}" = "stable" ]; then
            git add Sources/SaplingCore/Models/DTOs.swift
            # The stamped version can already match what's in the source — the
            # first stable release does, since 0.1.0 is also the placeholder.
            # `git commit` exits 1 on an empty commit, which would fail a
            # release that is otherwise entirely fine.
            if git diff --cached --quiet; then
              echo "version already recorded in the source"
            else
              git commit -m "chore(release): ${TAG} [skip ci]"
            fi
          fi

          # Idempotent: a previous attempt may have pushed the tag before
          # failing later on, and a re-run must not stop there.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists locally"
          else
            git tag -a "$TAG" -m "${{ steps.version.outputs.version }}"
          fi

          if [ "${{ steps.version.outputs.channel }}" = "stable" ]; then
            git push origin HEAD:main
          fi
          git push origin "$TAG" 2>&1 | tail -2 || echo "tag already on the remote"

      # Uses the REST API rather than `gh`, which the base VM image does not
      # carry — and adding it would be one more thing the image has to keep
      # up to date. curl is always present.
      - name: Publish
        if: steps.version.outputs.release == 'true'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          # Anything not finished is flagged prerelease, so the update checker
          # and a person reading the releases page agree without either having
          # to parse version strings.
          PRERELEASE=true
          if [ "$CHANNEL" = "stable" ] || [ "$CHANNEL" = "hotfix" ]; then
            PRERELEASE=false
          fi

          api() { curl -sS -H "Authorization: Bearer $TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          BODY=$(printf '{"tag_name":"%s","name":"%s","prerelease":%s,"generate_release_notes":true}' \
                 "$TAG" "$TAG" "$PRERELEASE")
          RESPONSE=$(api -X POST -d "$BODY" "https://api.github.com/repos/$REPO/releases")

          RELEASE_ID=$(printf '%s' "$RESPONSE" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
          if [ -z "$RELEASE_ID" ]; then
            echo "could not create the release:"; printf '%s\n' "$RESPONSE"; exit 1
          fi
          echo "created release $RELEASE_ID for $TAG"

          for FILE in dist/*.tar.gz dist/SHA256SUMS; do
            NAME=$(basename "$FILE")
            echo "uploading $NAME"
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$NAME" \
              > /dev/null
          done
          echo "published $TAG"
